name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행도 가능하게 둔다.
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한을 부여한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 타입체크가 포함된 빌드. 타입 오류가 있으면 배포되지 않는다.
      - name: 빌드
        run: npm run build

      # enablement: true면 레포 설정에서 Pages를 미리 켜두지 않아도
      # 워크플로가 자동으로 활성화한다(수동 설정 단계를 없애기 위함).
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
