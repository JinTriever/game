name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행도 가능하게 둔다.
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한을 부여한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 타입체크가 포함된 빌드. 타입 오류가 있으면 배포되지 않는다.
      - name: 빌드
        run: npm run build

      # enablement 옵션은 쓰지 않는다. 워크플로의 기본 GITHUB_TOKEN에는
      # Pages 사이트를 '생성'할 권한이 없어서 실패한다
      # (Resource not accessible by integration).
      # 최초 활성화는 레포 소유자 권한으로 한 번만 해두면 되고,
      # 그 뒤로는 이 단계가 기존 설정을 읽어오는 역할만 한다.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
